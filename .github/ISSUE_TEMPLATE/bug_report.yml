name: Bug report
description: Report a reproducible problem without private operational data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach databases, settings, certificates, keys, profiles, exports, server addresses, or customer data.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit identifier.
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows Server 2022
        - Windows 11
        - Other compatible Windows version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use only synthetic and redacted values.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all private keys, certificates, addresses, databases, settings, and customer data.
          required: true
