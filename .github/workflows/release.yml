name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to release from main (for example v0.2.0)"
        type: string
        required: true
      publish:
        description: "Publish the stable release (disable for a build-only test)"
        type: boolean
        required: true
        default: true
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

env:
  REQUESTED_VERSION: ${{ inputs.version }}
  REQUESTED_PUBLISH: ${{ inputs.publish }}

jobs:
  prepare:
    name: Validate version and scan release history
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Validate release version and source commit
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_version.py prepare

      - name: Scan complete history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release:
    name: Build Windows release
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - name: Check out the exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed." }
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build versioned Windows application
        shell: pwsh
        run: .\build.ps1 -PythonExecutable (Get-Command python).Source -ReleaseVersion $env:RELEASE_TAG

      - name: Smoke test packaged updater with synthetic data
        shell: pwsh
        run: python scripts/smoke_update.py dist/OpenVPNManager

      - name: Verify and package release
        id: package
        shell: pwsh
        run: |
          .\scripts\assert-release-safe.ps1 -ApplicationDirectory .\dist\OpenVPNManager
          $metadata = Get-Content .\dist\OpenVPNManager\_internal\build-info.json -Raw | ConvertFrom-Json
          if ($metadata.version -cne $env:RELEASE_TAG -or $metadata.commit -cne $env:SOURCE_COMMIT) {
              throw "Packaged identity does not match the validated release."
          }
          $archive = "OpenVPNManager-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -LiteralPath .\dist\OpenVPNManager -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$archive" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$archive.sha256" >> $env:GITHUB_OUTPUT

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.prepare.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}-windows-x64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

      - name: Create or verify the immutable release tag
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNED_TAG: ${{ needs.prepare.outputs.tag }}
          PLANNED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python scripts/release_version.py tag

      - name: Publish GitHub release
        if: needs.prepare.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          gh release create $env:RELEASE_TAG $env:ARCHIVE $env:CHECKSUM --verify-tag --latest --generate-notes --title "OpenVPN Manager $env:RELEASE_TAG" --notes "The Windows executables are unsigned. Verify the supplied SHA-256 checksum before extracting the archive."
          if ($LASTEXITCODE -ne 0) { throw "Stable release publication failed." }

      - name: Summarize release run
        shell: pwsh
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          "Version: $env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
          "Tested commit: $env:SOURCE_COMMIT" >> $env:GITHUB_STEP_SUMMARY
          "ZIP and SHA-256 artifacts are available for 14 days." >> $env:GITHUB_STEP_SUMMARY
          if ($env:PUBLISH -eq "true") {
              "Release: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
          } else {
              "Build-only test: no tag or release was created." >> $env:GITHUB_STEP_SUMMARY
          }
