name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify tag is based on main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "Release tag must point to a commit contained in main."
          }

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build Windows application
        shell: pwsh
        run: .\build.ps1 -PythonExecutable (Get-Command python).Source

      - name: Verify and package release
        id: package
        shell: pwsh
        run: |
          .\scripts\assert-release-safe.ps1 -ApplicationDirectory .\dist\MangoVPNManager
          $archive = "MangoVPNManager-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -LiteralPath .\dist\MangoVPNManager -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$archive" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$archive.sha256" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:ARCHIVE $env:CHECKSUM `
              --verify-tag `
              --generate-notes `
              --title "Mango VPN Manager $env:GITHUB_REF_NAME" `
              --notes "The Windows executable is currently unsigned. Verify the supplied SHA-256 checksum before extracting the archive."
